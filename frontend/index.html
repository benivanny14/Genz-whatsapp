<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/genz-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="WhatsApp clone with GENZ Ultra features" />

    <!-- Open Graph / link preview tags: without these, apps like WhatsApp/Telegram
         try to "guess" the page description and sometimes show other meta tags
         (e.g. viewport) instead of the app's proper title. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Genz Messenger" />
    <meta property="og:title" content="Genz Messenger" />
    <meta property="og:description" content="Jiunge na mazungumzo kwenye Genz Messenger." />
    <meta property="og:image" content="/icons/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Genz Messenger" />
    <meta name="twitter:description" content="Jiunge na mazungumzo kwenye Genz Messenger." />
    <meta name="twitter:image" content="/icons/apple-touch-icon.png" />

    <!-- PWA: lets Chrome/Android and iOS Safari install this as an app -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#128C7E" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GENZ" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Indie+Flower&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Lobster&family=Pacifico&family=Permanent+Marker&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Genz Messenger - Modern Chat Application</title>
    <!-- Preload the APK so the download starts immediately when the landing page loads -->
    <link rel="preload" href="/genz-whatsapp.apk" as="fetch" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
