server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # APK MIME type — nginx default mime.types doesn't include .apk,
  # so without this Chrome/Android download manager saves it as .zip
  types {
    application/vnd.android.package-archive apk;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Serve APK with correct Content-Type and download headers
  location ~* \.apk$ {
    add_header Content-Type "application/vnd.android.package-archive";
    add_header Content-Disposition "attachment; filename=genz-whatsapp.apk";
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Service worker must always be revalidated so PWA updates roll out
  # immediately instead of users being stuck on an old cached version.
  location = /service-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Content-Type "application/manifest+json";
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
