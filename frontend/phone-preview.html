<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GENZ — Phone Preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b141a; color: #e6edf3; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #111b21; border-bottom: 1px solid #1f2c33; flex-wrap: wrap; }
  .toolbar .title { font-weight: 700; font-size: 13px; color: #00a884; margin-right: auto; }
  .toolbar button { background: #1f2c33; color: #e6edf3; border: 1px solid #2d3b44; border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .toolbar button.active { background: #00a884; border-color: #00a884; color: #fff; font-weight: 600; }
  .toolbar button:hover { border-color: #00a884; }
  .stage { flex: 1; display: flex; justify-content: center; align-items: flex-start; overflow: hidden; padding: 12px; }
  .phone-wrap { transform-origin: top center; }
  .phone { position: relative; background: #000; border-radius: 44px; padding: 10px; box-shadow: 0 0 0 2px #2d3b44, 0 20px 60px rgba(0,0,0,.6); }
  .screen { border-radius: 34px; overflow: hidden; background: #0b141a; position: relative; }
  .screen iframe { display: block; width: 100%; height: 100%; border: 0; }
  .notch { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 34%; height: 24px; background: #000; border-radius: 0 0 14px 14px; z-index: 5; pointer-events: none; }
  .caption { text-align: center; font-size: 11px; color: #64748b; padding-top: 8px; }
  .status { font-size: 11px; color: #00a884; }
  .status.off { color: #f87171; }
</style>
</head>
<body>
  <div class="toolbar">
    <span class="title">GENZ · Phone Preview</span>
    <span class="status" id="status">…</span>
    <button id="b-iphone" class="active">iPhone 13 · 390×844</button>
    <button id="b-android">Pixel 7 · 412×915</button>
    <button id="b-refresh">⟳ Reload</button>
  </div>
  <div class="stage" id="stage">
    <div class="phone-wrap" id="wrap">
      <div class="phone">
        <div class="notch"></div>
        <div class="screen" id="screen">
          <iframe id="app" src="/" title="GENZ app"></iframe>
        </div>
      </div>
    </div>
  </div>
  <script>
    const SIZES = {
      iphone: { w: 390, h: 844, label: 'iPhone 13' },
      android: { w: 412, h: 915, label: 'Pixel 7' }
    };
    let mode = 'iphone';

    const screen = document.getElementById('screen');
    const frame = document.getElementById('app');
    const stage = document.getElementById('stage');
    const wrap = document.getElementById('wrap');
    const status = document.getElementById('status');

    function apply() {
      const { w, h } = SIZES[mode];
      screen.style.width = w + 'px';
      screen.style.height = h + 'px';
      const toolbarH = document.querySelector('.toolbar').offsetHeight + 16;
      const availW = stage.clientWidth - 40;
      const availH = window.innerHeight - toolbarH - 30;
      const scale = Math.min(1, availW / (w + 24), availH / (h + 44));
      wrap.style.transform = `scale(${scale})`;
      stage.style.paddingBottom = '8px';
    }

    function setMode(m) {
      mode = m;
      document.getElementById('b-iphone').classList.toggle('active', m === 'iphone');
      document.getElementById('b-android').classList.toggle('active', m === 'android');
      apply();
    }

    function refreshStatus() {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        const path = frame.contentWindow.location.pathname;
        const loggedIn = path !== '/login' && path !== '/register';
        status.textContent = (loggedIn ? '✓ In the app — ' : '○ At login — ') + path;
        status.className = 'status' + (loggedIn ? '' : ' off');
      } catch (e) {
        status.textContent = '○ …';
        status.className = 'status off';
      }
    }

    document.getElementById('b-iphone').onclick = () => setMode('iphone');
    document.getElementById('b-android').onclick = () => setMode('android');
    document.getElementById('b-refresh').onclick = () => { frame.src = '/'; refreshStatus(); };
    frame.onload = () => { apply(); refreshStatus(); };

    window.addEventListener('resize', apply);
    apply();
    setInterval(refreshStatus, 1500);
  </script>
</body>
</html>
