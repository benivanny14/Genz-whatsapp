<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GENZ Messenger — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b141a;
      color: #e9edef;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .container { max-width: 320px; }
    .icon {
      width: 80px; height: 80px;
      background: rgba(0,168,132,0.15);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    h1 { font-size: 20px; margin-bottom: 12px; }
    p { color: #8696a0; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
    button {
      background: #00a884; color: #fff; border: none;
      padding: 12px 32px; border-radius: 12px; font-size: 15px;
      font-weight: 600; cursor: pointer; width: 100%;
    }
    button:active { background: #06cf9c; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Huna Mtandao</h1>
    <p>Tafadhali angalia muunganisho wako wa intaneti kisha jaribu tena.</p>
    <button onclick="window.location.reload()">Jaribu Tena</button>
  </div>
</body>
</html>
