name: Build APK

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump version first (none = keep current version.json)'
        type: choice
        options: [none, patch, minor, major]
        default: none
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies (for sharp)
        run: cd backend && npm ci --legacy-peer-deps

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Restore release keystore from secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > frontend/android/genz-release.keystore
            echo "${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}" > frontend/android/keystore.properties
            echo "::notice::Release keystore restored — APK will be release-signed"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — APK will be DEBUG-signed (do NOT ship)"
          fi

      - name: Bump version (optional)
        if: inputs.bump != 'none' && inputs.bump != ''
        run: cd frontend && node scripts/bump-app-version.js ${{ inputs.bump }}
        env:
          INPUT_BUMP: ${{ inputs.bump }}

      - name: Build release APK
        run: cd frontend && npm run apk:build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}

      - name: Verify checksum consistency
        run: |
          cd frontend
          node -e "
            const { createHash } = require('crypto');
            const { readFileSync } = require('fs');
            const apk = readFileSync('public/genz-whatsapp.apk');
            const sha = createHash('sha256').update(apk).digest('hex');
            const v = JSON.parse(readFileSync('public/version.json', 'utf8'));
            console.log('version:', v.version, 'code:', v.versionCode);
            console.log('APK sha:', sha);
            console.log('v.json :', v.sha256);
            if (sha !== v.sha256) { console.error('MISMATCH'); process.exit(1); }
            console.log('MATCH OK');
          "

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: genz-whatsapp-${{ github.ref_name }}
          path: frontend/public/genz-whatsapp.apk
          if-no-files-found: error
