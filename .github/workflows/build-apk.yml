name: Build APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump version first (none = keep current version.json)'
        type: choice
        options: [none, patch, minor, major]
        default: none
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install backend dependencies (for sharp)
        run: cd backend && npm ci --legacy-peer-deps

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Restore release keystore from secrets
        id: restore-keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROP: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Strip whitespace/CRLF/quotes so wrapped or Windows-copied secrets still decode.
            printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n"' | base64 -d > frontend/android/genz-release.keystore \
              || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 — re-export with: base64 -w0 genz-release.jks"; exit 1; }
            printf '%s' "$KEYSTORE_PROP" | tr -d '\r' > frontend/android/keystore.properties
            # keystore.properties may point at a different storeFile name (e.g. .jks) — keep them consistent.
            STORE=$(grep -E '^storeFile=' frontend/android/keystore.properties | cut -d= -f2- | tr -d '\r\n')
            if [ -n "$STORE" ] && [ "$STORE" != "genz-release.keystore" ] && [ ! -f "frontend/android/$STORE" ]; then
              cp frontend/android/genz-release.keystore "frontend/android/$STORE"
              echo "::notice::Keystore also placed at $STORE (storeFile from keystore.properties)"
            fi
            # Smoke-test the keystore BEFORE burning a full Gradle build on a bad secret:
            #   1. -list                opens the store (validates storePassword + integrity)
            #   2. -list -alias <alias> confirms the signing alias exists (validates keyAlias)
            #   3. -certreq             touches the private key (validates keyPassword) — a wrong
            #                           key password otherwise surfaces only after the whole build
            if command -v keytool >/dev/null 2>&1; then
              KT_FILE=frontend/android/genz-release.keystore
              STORE_PASS=$(grep -E '^storePassword=' frontend/android/keystore.properties | cut -d= -f2- | tr -d '\r\n')
              KEY_ALIAS=$(grep -E '^keyAlias=' frontend/android/keystore.properties | cut -d= -f2- | tr -d '\r\n')
              KEY_PASS=$(grep -E '^keyPassword=' frontend/android/keystore.properties | cut -d= -f2- | tr -d '\r\n')
              KT_LIST=(-list -keystore "$KT_FILE")
              [ -n "$STORE_PASS" ] && KT_LIST+=(-storepass "$STORE_PASS")
              if ! keytool "${KT_LIST[@]}" </dev/null >/dev/null 2>&1; then
                echo "::error::Restored keystore failed keytool validation — wrong storePassword, truncated or corrupt secret"
                exit 1
              fi
              echo "::notice::Keystore store password validated"
              if [ -n "$KEY_ALIAS" ]; then
                KT_ALIAS=(-list -alias "$KEY_ALIAS" -keystore "$KT_FILE")
                [ -n "$STORE_PASS" ] && KT_ALIAS+=(-storepass "$STORE_PASS")
                if ! keytool "${KT_ALIAS[@]}" </dev/null >/dev/null 2>&1; then
                  echo "::error::keyAlias '$KEY_ALIAS' not found in restored keystore — check ANDROID_KEYSTORE_PROPERTIES"
                  exit 1
                fi
                echo "::notice::Signing alias '$KEY_ALIAS' present"
                if [ -n "$KEY_PASS" ]; then
                  KT_CERT=(-certreq -alias "$KEY_ALIAS" -keystore "$KT_FILE")
                  [ -n "$STORE_PASS" ] && KT_CERT+=(-storepass "$STORE_PASS")
                  [ -n "$KEY_PASS" ] && KT_CERT+=(-keypass "$KEY_PASS")
                  if ! keytool "${KT_CERT[@]}" </dev/null >/dev/null 2>&1; then
                    echo "::error::keyPassword for alias '$KEY_ALIAS' is wrong — check ANDROID_KEYSTORE_PROPERTIES"
                    exit 1
                  fi
                  echo "::notice::Signing key password validated"
                fi
              fi
            fi
            echo "restored=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release keystore restored — APK will be release-signed"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — APK will be DEBUG-signed (build proceeds for QA, but NOT published)"
          fi

      - name: Restore google-services.json from secrets (FCM + Analytics)
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_B64" | tr -d ' \t\r\n"' | base64 -d > frontend/android/app/google-services.json \
              || { echo "::error::FIREBASE_GOOGLE_SERVICES_JSON_B64 is not valid base64 — re-export with: base64 -w0 google-services.json"; exit 1; }
            echo "::notice::google-services.json restored — APK will have FCM + Analytics enabled"
          else
            echo "::warning::FIREBASE_GOOGLE_SERVICES_JSON_B64 not set — APK built WITHOUT FCM/Analytics (do NOT ship for push)"
          fi

      - name: Bump version (optional)
        if: inputs.bump != 'none' && inputs.bump != ''
        run: cd frontend && node scripts/bump-app-version.js ${{ inputs.bump }}
        env:
          INPUT_BUMP: ${{ inputs.bump }}

      - name: Build release APK
        run: |
          cd frontend
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          sdkmanager --list_installed 2>/dev/null | head -5 || echo "sdkmanager list not available"
          npm run apk:build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
          CI: 'true'
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Verify checksum consistency
        run: |
          cd frontend
          node -e "
            const { createHash } = require('crypto');
            const { readFileSync } = require('fs');
            const apk = readFileSync('public/genz-whatsapp.apk');
            const sha = createHash('sha256').update(apk).digest('hex');
            const v = JSON.parse(readFileSync('public/version.json', 'utf8'));
            console.log('version:', v.version, 'code:', v.versionCode);
            console.log('APK sha:', sha);
            console.log('v.json :', v.sha256);
            if (sha !== v.sha256) { console.error('MISMATCH'); process.exit(1); }
            console.log('MATCH OK');
          "

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: genz-whatsapp-${{ github.ref_name }}
          path: frontend/public/genz-whatsapp.apk
          if-no-files-found: error

      # Never publish a DEBUG-signed APK as an official release. The keystore
      # restore step above fails fast on a bad secret and reports restored=false
      # when ANDROID_KEYSTORE_BASE64 is missing, so this step only runs when the
      # release keystore was actually restored (build.gradle then signs with it).
      - name: Publish APK to GitHub Releases
        if: steps.restore-keystore.outputs.restored == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd frontend
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('public/version.json','utf8')).version)")
          TAG="v${VERSION}"
          echo "Publishing APK ${TAG}..."
          # Delete existing release with this tag (if any)
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}" \
            | node -e "process.stdin.on('data',d=>{try{console.log(JSON.parse(d).id||'')}catch{console.log('')}})")
          if [ -n "$RELEASE_ID" ]; then
            echo "Deleting old release $RELEASE_ID..."
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
          fi
          # Create new release
          RELEASE_ID=$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"Genz Messenger APK\",\"draft\":false,\"prerelease\":false}" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            | node -e "process.stdin.on('data',d=>{try{console.log(JSON.parse(d).id||'')}catch{console.log('')}})")
          echo "Release ID: $RELEASE_ID"
          # Upload APK
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @public/genz-whatsapp.apk \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=genz-whatsapp.apk"
          echo "✅ APK published to ${TAG}"


