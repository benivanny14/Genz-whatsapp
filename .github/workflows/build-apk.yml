name: Build signed GENZ WhatsApp APK

on:
  push:
    branches: [main]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require signing and Firebase secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
        run: |
          missing=()
          [ -z "$ANDROID_KEYSTORE_B64" ] && missing+=("ANDROID_KEYSTORE_B64")
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "$ANDROID_KEY_ALIAS" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "$ANDROID_KEY_PASSWORD" ] && missing+=("ANDROID_KEY_PASSWORD")
          [ -z "$FIREBASE_GOOGLE_SERVICES_JSON_B64" ] && missing+=("FIREBASE_GOOGLE_SERVICES_JSON_B64")
          [ -z "$VITE_API_URL" ] && missing+=("VITE_API_URL")
          [ -z "$VITE_SOCKET_URL" ] && missing+=("VITE_SOCKET_URL")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required GitHub secrets: ${missing[*]}"
            echo "Add them in repo Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p frontend/android/keystore
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > frontend/android/keystore/release.jks

      - name: Decode google-services.json
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          mkdir -p frontend/android/app
          echo "$FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 -d > frontend/android/app/google-services.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build signed release APK
        working-directory: frontend
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
        run: npm run apk:build

      - name: Verify APK signatures
        run: |
          APK="frontend/public/downloads/genz-whatsapp.apk"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          OUTPUT=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Verified using v1 scheme (JAR signing): true"
          echo "$OUTPUT" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: genz-whatsapp-apk
          path: |
            frontend/public/downloads/genz-whatsapp.apk
            frontend/public/downloads/version.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./frontend/public/downloads/version.json').versionName")
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              frontend/public/downloads/genz-whatsapp.apk \
              frontend/public/downloads/version.json \
              --clobber
          else
            gh release create "${{ github.ref_name }}" \
              frontend/public/downloads/genz-whatsapp.apk \
              frontend/public/downloads/version.json \
              --title "GENZ WhatsApp $VERSION" \
              --notes "Signed release APK for ${{ github.ref_name }}" \
              --latest
          fi
