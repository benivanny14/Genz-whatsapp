name: Render status

# Manual: Actions tab → "Render status" → Run workflow.
# Prints the service's deploy history + current instance state using the
# repo's RENDER_API_KEY / RENDER_SERVICE_ID secrets — handy when the Render
# dashboard is unreachable (e.g. to see why a deploy failed or the APK
# download is slow). No deploy is triggered — read-only.
#
# The action step supports --service to inspect a second service (the repo
# historically has genz-whatsapp AND genz-whatsapp-1).

on:
  workflow_dispatch:
    inputs:
      service_id:
        description: 'Override RENDER_SERVICE_ID (e.g. a second service)'
        required: false
        default: ''
      limit:
        description: 'How many deploys to list'
        required: false
        default: '5'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Query Render deploys
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: node scripts/render-deploy-status.js --limit ${{ inputs.limit }} ${{ inputs.service_id && format('--service {0}', inputs.service_id) }}

      - name: Public endpoint health check
        run: |
          for HOST in genz-whatsapp.onrender.com genz-whatsapp-1.onrender.com genz-whatsapp-2.onrender.com; do
            for PATH in /api/health /version.json /; do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://$HOST$PATH" || echo ERR)
              echo "$HOST $PATH -> $CODE"
            done
          done
