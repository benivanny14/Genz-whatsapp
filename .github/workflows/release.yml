name: Release APK

# Publish a GitHub release (with the signed APK attached) every time a
# version tag like v1.1.0 is pushed. The release notes come from the newest
# CHANGELOG.md entry — see scripts/create-github-release.js.
#
# Release flow (see docs/APK_RELEASE_CHECKLIST.md):
#   1. npm run bump:apk (bumps versionCode/versionName + version.json)
#   2. npm run apk:build (builds + signs the APK, fills sha256/size)
#   3. commit + push, then:  git tag vX.Y.Z && git push origin vX.Y.Z
#
# The workflow checks out the tagged commit, which contains the final APK.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/create-github-release.js
