name: CI

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Weekly run so the e2e/integration suites stay verified against the
    # latest MongoDB image even when the repo is quiet.
    - cron: '0 3 * * 1'   # Monday 03:00 UTC
  workflow_dispatch:
    # Manual trigger from the Actions tab (useful to re-verify the e2e suite
    # on demand, e.g. after a fix, without waiting for the weekly schedule).

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps

      - name: Syntax check + route exports
        run: |
          cd backend
          npm run check
          npm run check:exports

      - name: Run backend tests
        run: |
          cd backend
          npm test

  integration-tests:
    name: Integration tests (real MongoDB)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps

      - name: Run integration tests (isolated DB)
        run: |
          cd backend
          MONGO_TEST_URI=mongodb://127.0.0.1:27017/genz-integration-test \
          JWT_SECRET=ci-it-only-jwt-secret-0123456789abcdef \
          JWT_REFRESH_SECRET=ci-it-only-refresh-secret-0123456789abcdef \
          ADMIN_JWT_SECRET=ci-it-only-admin-secret-0123456789abcdef \
          npx jest tests/deletedMessageIntegration.test.js tests/adminPrepIntegration.test.js --runInBand --forceExit

  frontend-tests:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm test

      - name: JSX import check (missing lucide/component imports)
        run: |
          cd frontend
          npm run check:jsx

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      # Runs in the frontend dir so npx resolves the local playwright
      # (frontend devDependency) instead of fetching/prompting at repo root.
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Production-style single origin: the backend serves the built UI, the
      # API and Socket.IO on :5000 — the same layout the e2e specs run against
      # in production. We build the frontend and boot the backend directly
      # (no Vite dev proxy), then Playwright targets http://127.0.0.1:5000
      # (reuseExistingServer skips its own `vite preview` webServer).
      #
      # The suite includes DB-backed specs that register real users against the
      # backend: privacy-selectors, privacy-contact-selector, mass-message,
      # abuse-report, admin-crash-panel, settings-tabs, chat-interactions,
      # bubble-interactions, header-composer, anti-revoke, block-flow, voice,
      # deleted-messages-boundary.
      # mass-message exercises the 20-recipient cap and 5/hour rate limit;
      # abuse-report drives report → admin list → resolve. Both admin specs
      # provision the shared `e2e_admin` AdminOwner via
      # backend/scripts/e2e-admin-prep.js against MONGODB_URI below — the prep
      # upserts atomically, so the specs are safe to run in parallel workers
      # (proven by tests/adminPrepIntegration.test.js in the integration job).
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Playwright e2e suite
        working-directory: frontend
        env:
          # The backend's validateEnv fails startup without these (backend/.env
          # provides them locally). NODE_ENV=development skips production gates.
          NODE_ENV: development
          PORT: '5000'
          JWT_EXPIRE: 7d
          # Isolated test database on the throwaway mongo service container
          # (never the real 'genz-whatsapp' DB). MONGODB_URI (backend) and
          # MONGO_URI (specs/prep scripts) must point at the SAME database:
          # e2e/global-setup.js fails the run if they diverge instead of
          # leaking test users into another database.
          MONGODB_URI: mongodb://127.0.0.1:27017/genz-e2e-test
          MONGO_URI: mongodb://127.0.0.1:27017/genz-e2e-test
          # Raised ONLY for the 8-worker admin-parallel stress step below: the
          # strict default (10 admin-login requests/15 min per IP) would trip
          # with 8 concurrent login flows. CI runs throwaway secrets on an
          # ephemeral runner, so this has zero production impact.
          ADMIN_LOGIN_MAX: '100'
          # Raised ONLY for the feature-verification step below: it legitimately
          # exercises ~10 sensitive admin endpoints in one run (strict default is
          # 10/hour). Throwaway secrets on an ephemeral runner — zero prod impact.
          ADMIN_STRICT_MAX: '100'
          # The full suite registers many users in parallel from one runner IP
          # and would trip the 100/15min auth budget (same throwaway-runner
          # rationale as ADMIN_* above).
          AUTH_RATE_MAX: '100000'
          PHONE_VERIFICATION_REQUIRED: 'false'
          # CI-only throwaway signing secrets (never used outside this workflow).
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-e2e-only-jwt-secret-0123456789abcdef' }}
          ADMIN_JWT_SECRET: ${{ secrets.CI_ADMIN_JWT_SECRET || 'ci-e2e-only-admin-secret-0123456789abcdef' }}
        run: |
          (cd ../backend && node server.js) > /tmp/genz-dev.log 2>&1 &
          DEV_PID=$!
          READY=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:5000/api/health >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo '--- backend failed to start ---'
            tail -30 /tmp/genz-dev.log | sed 's/^/::error::/' | head -8
            echo '::error::Backend never became ready on :5000'
            kill $DEV_PID 2>/dev/null || true
            exit 1
          fi
          set +e
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:5000 npx playwright test > /tmp/pw.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" != "0" ]; then
            echo "::error::Playwright exited with $STATUS"
            grep -E "✓|✘|passed|failed|flaky|skipped|Error:|at |expect\(|Timeout|Error \[|> " /tmp/pw.log | tail -20 | sed 's/^/::error::/' | head -8
          fi

          # Deleted-message anti-revoke e2e via the socket path (frontend's
          # exact flow: socket 'message:delete' → viewer → restore). Runs while
          # the dev stack is still up; unique users per run, no DB wiping.
          if ! (cd ../backend && node scripts/e2e-deleted-message.js http://127.0.0.1:5000); then
            echo "::error::Deleted-message socket e2e failed"
            STATUS=1
          fi

          # Presence privacy e2e via REAL socket clients: owner online with
          # lastSeen=contacts_except → the excluded contact must not receive
          # user:online / user:offline while an allowed contact does.
          if ! (cd ../backend && node scripts/e2e-presence-privacy.js http://127.0.0.1:5000); then
            echo "::error::Presence-privacy socket e2e failed"
            STATUS=1
          fi

          # Feature verification against the live single-origin stack: the
          # API smoke test (137 checks) + the full verification (186 checks:
          # status / chat / group roles / settings / admin 2FA + control).
          # Both provision throwaway users + a TEST admin owner on the
          # throwaway e2e DB — never the real 'genz-whatsapp' database.
          if ! (cd ../backend && node scripts/feature-smoke-test.js); then
            echo "::error::Feature smoke test failed"
            STATUS=1
          fi
          if ! (cd ../backend && node scripts/feature-full-verification.js); then
            echo "::error::Feature full verification failed"
            STATUS=1
          fi

          # Parallel-admin stress: re-run ONLY the two admin specs with 8
          # Playwright workers (--repeat-each makes 8 file instances share the
          # workers). Per-spec credentials + race-safe prep must hold under
          # maximum parallelism — this is the proof the 2-core default (1
          # worker) never exercises. ADMIN_LOGIN_MAX above keeps the strict
          # admin rate limiter from masking the test.
          if ! PLAYWRIGHT_BASE_URL=http://127.0.0.1:5000 npx playwright test e2e/admin-crash-panel.spec.js e2e/abuse-report.spec.js --workers=8 --repeat-each=4 > /tmp/pw-admin-parallel.log 2>&1; then
            echo "::error::Parallel admin specs (8 workers) failed"
            grep -E "passed|failed|Error:|expect\(|Timeout|Too many" /tmp/pw-admin-parallel.log | tail -10 | sed 's/^/::error::/' | head -6
            STATUS=1
          fi
          kill $DEV_PID 2>/dev/null || true
          exit $STATUS

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
