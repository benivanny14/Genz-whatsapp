name: CI

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Weekly run so the e2e/integration suites stay verified against the
    # latest MongoDB image even when the repo is quiet.
    - cron: '0 3 * * 1'   # Monday 03:00 UTC

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps

      - name: Syntax check + route exports
        run: |
          cd backend
          npm run check
          npm run check:exports

      - name: Run backend tests
        run: |
          cd backend
          npm test

  integration-tests:
    name: Integration tests (real MongoDB)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps

      - name: Run deleted-messages integration test (isolated DB)
        run: |
          cd backend
          MONGO_TEST_URI=mongodb://127.0.0.1:27017/genz-integration-test \
          JWT_SECRET=ci-it-only-jwt-secret-0123456789abcdef \
          JWT_REFRESH_SECRET=ci-it-only-refresh-secret-0123456789abcdef \
          ADMIN_JWT_SECRET=ci-it-only-admin-secret-0123456789abcdef \
          npx jest tests/deletedMessageIntegration.test.js --runInBand --forceExit

  frontend-tests:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm test

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Production-style single origin: the backend serves the built UI, the
      # API and Socket.IO on :5000 — the same layout the e2e specs run against
      # in production. We build the frontend and boot the backend directly
      # (no Vite dev proxy), then Playwright targets http://127.0.0.1:5000
      # (reuseExistingServer skips its own `vite preview` webServer).
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Playwright e2e suite
        working-directory: frontend
        env:
          # The backend's validateEnv fails startup without these (backend/.env
          # provides them locally). NODE_ENV=development skips production gates.
          NODE_ENV: development
          PORT: '5000'
          JWT_EXPIRE: 7d
          MONGODB_URI: mongodb://127.0.0.1:27017/genz-whatsapp
          PHONE_VERIFICATION_REQUIRED: 'false'
          # CI-only throwaway signing secrets (never used outside this workflow).
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-e2e-only-jwt-secret-0123456789abcdef' }}
          ADMIN_JWT_SECRET: ${{ secrets.CI_ADMIN_JWT_SECRET || 'ci-e2e-only-admin-secret-0123456789abcdef' }}
        run: |
          (cd ../backend && node server.js) > /tmp/genz-dev.log 2>&1 &
          DEV_PID=$!
          READY=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:5000/api/health >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo '--- backend failed to start ---'
            tail -30 /tmp/genz-dev.log | sed 's/^/::error::/' | head -8
            echo '::error::Backend never became ready on :5000'
            kill $DEV_PID 2>/dev/null || true
            exit 1
          fi
          set +e
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:5000 npx playwright test > /tmp/pw.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" != "0" ]; then
            echo "::error::Playwright exited with $STATUS"
            grep -E "✓|✘|passed|failed|flaky|skipped|Error:|at |expect\(|Timeout|Error \[|> " /tmp/pw.log | tail -20 | sed 's/^/::error::/' | head -8
          fi

          # Deleted-message anti-revoke e2e via the socket path (frontend's
          # exact flow: socket 'message:delete' → viewer → restore). Runs while
          # the dev stack is still up; unique users per run, no DB wiping.
          if ! (cd ../backend && node scripts/e2e-deleted-message.js http://127.0.0.1:5000); then
            echo "::error::Deleted-message socket e2e failed"
            STATUS=1
          fi
          kill $DEV_PID 2>/dev/null || true
          exit $STATUS

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
