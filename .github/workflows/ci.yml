name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps

      - name: Syntax check + route exports
        run: |
          cd backend
          npm run check
          npm run check:exports

      - name: Run backend tests
        run: |
          cd backend
          npm test

  frontend-tests:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm test

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # On CI, Playwright's webServer would run `vite preview` (port 4174, no
      # /api proxy) which the specs don't support — so we boot the real dev
      # server (start-dev.js starts backend :5000 + Vite :5176) ourselves first.
      # The backend inherits the env below (MongoDB service container + phones
      # auto-verified). Once :5176 answers, Playwright's reuseExistingServer
      # skips its own webServer entirely.
      - name: Run Playwright e2e suite
        working-directory: frontend
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/genz-whatsapp
          PHONE_VERIFICATION_REQUIRED: 'false'
          # CI-only throwaway signing secrets (never used outside this workflow).
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-e2e-only-jwt-secret-0123456789abcdef' }}
          ADMIN_JWT_SECRET: ${{ secrets.CI_ADMIN_JWT_SECRET || 'ci-e2e-only-admin-secret-0123456789abcdef' }}
        run: |
          GENZ_DEV_PORT=5176 nohup npm run dev > /tmp/genz-dev.log 2>&1 &
          DEV_PID=$!
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:5176 >/dev/null 2>&1 && curl -sf http://127.0.0.1:5000/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:5176 >/dev/null 2>&1; then
            echo '--- dev server failed to start ---'
            cat /tmp/genz-dev.log
            kill $DEV_PID 2>/dev/null || true
            exit 1
          fi
          set +e
          GENZ_DEV_PORT=5176 PLAYWRIGHT_BASE_URL=http://127.0.0.1:5176 npx playwright test
          STATUS=$?
          set -e
          kill $DEV_PID 2>/dev/null || true
          exit $STATUS

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
