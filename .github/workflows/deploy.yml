name: Deploy to Production

# Deploy the backend when backend-relevant code changes, and the frontend
# when frontend code changes. The Render service serves both the API and the
# built frontend bundle, so a frontend-only change must also trigger a deploy
# or production silently keeps the old UI (users report bugs that are already
# fixed in the repo). Docs/scripts still don't trigger deploys.
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'render.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      # ── QUALITY GATES: never ship broken code to production ──
      - name: Run backend unit tests
        run: |
          cd backend
          npx jest --runInBand --testPathIgnorePatterns='(integration|Integration|viewOnce\.flow)' --no-coverage --forceExit
      
      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
      
      # NOTE: johnbeynon/render-deploy-action@v0.0.8 only accepts 'service-id'
      # and 'api-key' as inputs — 'render-api-key'/'wait-for-success' were
      # silently ignored, so the deploy step exited 0 while Render returned 401
      # (no API key sent) and production never actually deployed.
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
