name: Deploy to Production

# Only deploy the backend when backend-relevant code changes. The free-tier
# instance is single-instance: every deploy deactivates the live one for the
# ~2 min build+swap, so docs/scripts/frontend-only merges caused repeated
# outages. The frontend hosts (genz-whatsapp-1/2) are NOT auto-deployed by
# this workflow — they are redeployed via "Render fix proxy" / the Render
# dashboard — so a frontend-only change does not reach production here anyway.
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'render.yaml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      # ── QUALITY GATES: never ship broken code to production ──
      - name: Run backend tests
        run: |
          cd backend
          npx jest --runInBand
      
      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
      
      # NOTE: johnbeynon/render-deploy-action@v0.0.8 only accepts 'service-id'
      # and 'api-key' as inputs — 'render-api-key'/'wait-for-success' were
      # silently ignored, so the deploy step exited 0 while Render returned 401
      # (no API key sent) and production never actually deployed.
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
