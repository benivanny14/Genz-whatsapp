name: Deploy to Production

# Deploy the backend when backend-relevant code changes, and the frontend
# when frontend code changes. The Render service serves both the API and the
# built frontend bundle, so a frontend-only change must also trigger a deploy
# or production silently keeps the old UI (users report bugs that are already
# fixed in the repo). Docs/scripts still don't trigger deploys.
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'render.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Throwaway MongoDB for the migration gate below — never the production one.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      # ── QUALITY GATES: never ship broken code to production ──
      # The suite selection lives in backend/jest.ci.config.js so CI, deploy and
      # local runs cannot drift apart.
      - name: Run backend tests (fast suite)
        run: |
          cd backend
          npm run test:ci

      # Migrations are manual (see docs/MIGRATIONS_RUNBOOK.md), so a migration
      # that crashes, silently no-ops or cannot be reverted would only be
      # discovered while operating production. Gate the deploy on the same
      # up/down round-trip CI runs.
      - name: Migrations round-trip (deploy gate)
        run: |
          cd backend
          MONGO_TEST_URI=mongodb://127.0.0.1:27017/genz-migrations-deploy-gate \
          JWT_SECRET=deploy-gate-only-jwt-secret-0123456789abcdef \
          JWT_REFRESH_SECRET=deploy-gate-only-refresh-secret-0123456789abcdef \
          ADMIN_JWT_SECRET=deploy-gate-only-admin-secret-0123456789abcdef \
          npx jest tests/migrationsRoundtrip.integration.test.js --runInBand --forceExit
      
      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
      
      # NOTE: johnbeynon/render-deploy-action@v0.0.8 only accepts 'service-id'
      # and 'api-key' as inputs — 'render-api-key'/'wait-for-success' were
      # silently ignored, so the deploy step exited 0 while Render returned 401
      # (no API key sent) and production never actually deployed.
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
