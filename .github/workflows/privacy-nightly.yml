name: Privacy Nightly

on:
  schedule:
    # Nightly full-stack privacy regression against the latest MongoDB image
    # and latest code — catches realtime/UI privacy regressions the unit
    # suites cannot (presence broadcasts, contact-selector exclusion flows).
    - cron: '30 2 * * *'   # every night 02:30 UTC
  workflow_dispatch:
    # Manual trigger from the Actions tab (re-verify privacy on demand).

jobs:
  privacy-regression:
    name: Privacy regression (full stack e2e)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Single-origin stack exactly like the CI e2e job: backend serves the
      # built UI + API + Socket.IO on :5000, then `npm run privacy:regression:e2e`
      # runs the full harness (backend checks/tests, frontend tests/build,
      # Playwright privacy spec, presence-privacy socket e2e).
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run privacy regression (full stack)
        working-directory: .
        env:
          NODE_ENV: development
          PORT: '5000'
          JWT_EXPIRE: 7d
          # Isolated test database on the throwaway mongo service container
          # (never the real 'genz-whatsapp' DB).
          MONGODB_URI: mongodb://127.0.0.1:27017/genz-privacy-nightly
          MONGO_URI: mongodb://127.0.0.1:27017/genz-privacy-nightly
          PHONE_VERIFICATION_REQUIRED: 'false'
          # Raised ONLY for the feature-verification scripts inside
          # privacy-regression.sh (they exercise ~10 sensitive admin endpoints
          # in one run; strict default is 10/hour). Throwaway secrets on an
          # ephemeral runner — zero production impact.
          ADMIN_STRICT_MAX: '100'
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-privacy-nightly-jwt-secret-0123456789abcdef' }}
          ADMIN_JWT_SECRET: ${{ secrets.CI_ADMIN_JWT_SECRET || 'ci-privacy-nightly-admin-secret-0123456789abcdef' }}
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5000
        run: |
          (cd backend && node server.js) > /tmp/genz-privacy.log 2>&1 &
          DEV_PID=$!
          READY=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:5000/api/health >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo '--- backend failed to start ---'
            tail -30 /tmp/genz-privacy.log | sed 's/^/::error::/' | head -8
            echo '::error::Backend never became ready on :5000'
            kill $DEV_PID 2>/dev/null || true
            exit 1
          fi
          if ! npm run privacy:regression:e2e > /tmp/privacy-nightly.log 2>&1; then
            echo "::error::Privacy regression failed"
            grep -aE "❌|FAIL|✕|Results:|Error:" /tmp/privacy-nightly.log | tail -15 | sed 's/^/::error::/' | head -8
            exit 1
          fi
          kill $DEV_PID 2>/dev/null || true
