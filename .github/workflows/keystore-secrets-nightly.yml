name: Keystore Secrets Nightly

# Nightly check that the Android release keystore secrets are present and
# usable BEFORE the next release build needs them: a missing or broken
# ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PROPERTIES would make the next
# APK DEBUG-signed (which build-apk.yml now refuses to publish). Runs the same
# keytool validation as the build-apk workflow and files a 🔑 alert issue when
# something is wrong (self-healing: closes it again once healthy).
on:
  schedule:
    # 03:30 UTC — between prod-health (03:15) and its verify run (03:45).
    - cron: '30 3 * * *'
  workflow_dispatch:
    # Manual trigger from the Actions tab to validate on demand.

permissions:
  contents: read
  issues: write # to file/close keystore alert issues

jobs:
  keystore-secrets:
    name: Validate release keystore secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (keytool)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore and validate keystore from secrets
        id: validate
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROP: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          MISSING=""
          [ -z "$KEYSTORE_B64" ] && MISSING="$MISSING ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PROP" ] && MISSING="$MISSING ANDROID_KEYSTORE_PROPERTIES"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing keystore secrets:$MISSING — the next APK release would be DEBUG-signed (and NOT published)"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # Strip whitespace/CRLF/quotes so wrapped or Windows-copied secrets still decode.
          printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n"' | base64 -d > frontend/android/genz-release.keystore \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 — re-export with: base64 -w0 genz-release.jks"; echo "valid=false" >> "$GITHUB_OUTPUT"; exit 1; }
          printf '%s' "$KEYSTORE_PROP" | tr -d '\r' > frontend/android/keystore.properties
          # keystore.properties may point at a different storeFile name (e.g. .jks) — keep them consistent.
          STORE=$(grep -E '^storeFile=' frontend/android/keystore.properties | cut -d= -f2- | tr -d '\r\n')
          if [ -n "$STORE" ] && [ "$STORE" != "genz-release.keystore" ] && [ ! -f "frontend/android/$STORE" ]; then
            cp frontend/android/genz-release.keystore "frontend/android/$STORE"
          fi
          KT_FILE=frontend/android/genz-release.keystore
          STORE_PASS=$(grep -E '^storePassword=' frontend/android/keystore.properties | cut -d= -f2- | tr -d '\r\n')
          KEY_ALIAS=$(grep -E '^keyAlias=' frontend/android/keystore.properties | cut -d= -f2- | tr -d '\r\n')
          KEY_PASS=$(grep -E '^keyPassword=' frontend/android/keystore.properties | cut -d= -f2- | tr -d '\r\n')
          # 1) Open the store (validates storePassword + integrity)
          KT_LIST=(-list -keystore "$KT_FILE")
          [ -n "$STORE_PASS" ] && KT_LIST+=(-storepass "$STORE_PASS")
          if ! keytool "${KT_LIST[@]}" </dev/null >/dev/null 2>&1; then
            echo "::error::Restored keystore failed keytool validation — wrong storePassword, truncated or corrupt secret"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # 2) Confirm the signing alias exists (validates keyAlias)
          if [ -n "$KEY_ALIAS" ]; then
            KT_ALIAS=(-list -alias "$KEY_ALIAS" -keystore "$KT_FILE")
            [ -n "$STORE_PASS" ] && KT_ALIAS+=(-storepass "$STORE_PASS")
            if ! keytool "${KT_ALIAS[@]}" </dev/null >/dev/null 2>&1; then
              echo "::error::keyAlias '$KEY_ALIAS' not found in restored keystore — check ANDROID_KEYSTORE_PROPERTIES"
              echo "valid=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            # 3) Touch the private key (validates keyPassword)
            if [ -n "$KEY_PASS" ]; then
              KT_CERT=(-certreq -alias "$KEY_ALIAS" -keystore "$KT_FILE")
              [ -n "$STORE_PASS" ] && KT_CERT+=(-storepass "$STORE_PASS")
              [ -n "$KEY_PASS" ] && KT_CERT+=(-keypass "$KEY_PASS")
              if ! keytool "${KT_CERT[@]}" </dev/null >/dev/null 2>&1; then
                echo "::error::keyPassword for alias '$KEY_ALIAS' is wrong — check ANDROID_KEYSTORE_PROPERTIES"
                echo "valid=false" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi
          fi
          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Release keystore secrets OK — store password, signing alias '$KEY_ALIAS' and key password all validated"

      # Self-healing: when the check passes, close stale 🔑 keystore alert
      # issues so a recovered secret doesn't leave a scary open issue behind.
      - name: Close stale keystore alert issues when healthy
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['keystore']
            });
            const stale = open.filter((i) => i.title.startsWith('🔑 Keystore secrets'));
            for (const issue of stale) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              console.log('Closed stale issue #' + issue.number);
            }
            if (stale.length === 0) console.log('No stale keystore alert issues to close');

      # Manual runs are for testing the validation itself — only scheduled
      # runs file issues, so an intentional secret-removal test doesn't spam.
      - name: File alert issue on failure
        if: failure() && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            // The 'keystore' label must exist before the API accepts it.
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'keystore'
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'keystore',
                color: '5319e7',
                description: 'Keystore / APK signing alerts'
              });
            }
            const today = new Date().toISOString().slice(0, 10);
            const title = `🔑 Keystore secrets missing or invalid (${today})`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['keystore']
            });
            const alreadyOpen = existing.some((issue) => issue.title === title);
            if (!alreadyOpen) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['keystore'],
                body: [
                  '## Keystore secrets check failed',
                  '',
                  `- **Time (UTC):** ${new Date().toISOString()}`,
                  `- **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  '',
                  '`ANDROID_KEYSTORE_BASE64` / `ANDROID_KEYSTORE_PROPERTIES` are missing, or the restored keystore failed `keytool` validation (wrong storePassword, keyAlias, or keyPassword).',
                  '',
                  '**Impact:** the next APK build would be DEBUG-signed and therefore NOT published to GitHub Releases. Fix the secrets in Settings → Secrets and variables → Actions, then re-run the **Keystore Secrets Nightly** workflow to confirm.',
                  '',
                  'See docs/KEYSTORE_BACKUP.md and docs/MWONGOZO_APK_NA_DEPLOY.md.'
                ].join('\n')
              });
              console.log('Keystore alert issue created');
            } else {
              console.log('Keystore alert issue already open — skipping duplicate');
            }