name: Production Health Nightly

on:
  schedule:
    # Every night 03:15 UTC — verifies the deployed service on Render is
    # actually healthy (deploy live, mongo connected, cloudinary media).
    # Catches silent production outages the unit/e2e suites cannot.
    - cron: '15 3 * * *'
  workflow_dispatch:
    # Manual trigger from the Actions tab (verify production health on demand).

permissions:
  contents: read
  issues: write # to file an alert issue when a health check fails

jobs:
  prod-health:
    name: Production health check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify production health (Render API + /api/health)
        id: health
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          # The UI host (genz-whatsapp-1) sleeps on the free tier and returns
          # 502/000 for /api/health while cold — that raised FALSE-POSITIVE
          # alerts. The real API (with MongoDB) lives on genz-whatsapp.onrender.com
          # and stays warm, so the public health check targets THAT host. The
          # Render API layer still verifies the deploy service by ID (UI host).
          # Long retries give free-tier cold starts room to wake up.
          VERIFY_MAX_ATTEMPTS: '6'
          VERIFY_BASE_DELAY_MS: '5000'
        run: |
          node scripts/render-deploy-verify.js https://genz-whatsapp.onrender.com > /tmp/prod-health.log 2>&1 || {
            echo '::error::Production health check FAILED'
            tail -20 /tmp/prod-health.log | sed 's/^/::error::/' | head -10
            exit 1
          }
          cat /tmp/prod-health.log

      - name: Verify version.json + APK reachability on production
        id: apk
        run: |
          UI=https://genz-whatsapp-1.onrender.com
          echo "-- version.json --"
          LIVE_VER=$(curl -sf -m 60 "$UI/version.json" | grep -o '"version": "[^"]*"' | head -1 || true)
          echo "live: ${LIVE_VER:-UNREACHABLE}"
          REPO_VER=$(grep -o '"version": "[^"]*"' frontend/public/version.json | head -1)
          echo "repo: $REPO_VER"
          echo "live_ver=$LIVE_VER" >> "$GITHUB_OUTPUT"
          echo "repo_ver=$REPO_VER" >> "$GITHUB_OUTPUT"
          echo "run_url=https://github.com/benivanny14/Genz-whatsapp/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          if [ -z "$LIVE_VER" ]; then
            echo '::error::version.json unreachable on production (UI host)'
            exit 1
          fi
          if [ "$LIVE_VER" != "$REPO_VER" ]; then
            echo '::error::deployed version differs from repo — Render deploy may be lagging or failed (see the comparison in the alert issue)'
            exit 1
          fi
          echo "-- APK reachability (first 1KB) --"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 60 -r 0-1023 "$UI/genz-whatsapp.apk" || true)
          echo "apk range request: HTTP $CODE"
          if [ "$CODE" != "206" ] && [ "$CODE" != "200" ]; then
            echo '::error::APK download from the UI host is failing (free-tier stall?)'
            exit 1
          fi
          echo "-- API host health --"
          API_CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 60 "https://genz-whatsapp.onrender.com/api/health" || true)
          echo "api host health: HTTP $API_CODE"
          if [ "$API_CODE" != "200" ]; then
            echo '::error::API host (genz-whatsapp.onrender.com) not healthy'
            exit 1
          fi

      # The web app's ONLY path to the API is the vite-preview proxy on the UI
      # host (frontend → GENZ_BACKEND_TARGET → backend). A backend that is up
      # while genz-whatsapp-1's proxy is misconfigured (e.g. GENZ_BACKEND_TARGET
      # reset to localhost:5000 — the Aug 2026 incident) leaves users unable to
      # log in, so the nightly must check /api THROUGH the proxy too. Free-tier
      # cold starts return 502/000 for a minute or two, hence long retries.
      - name: Verify proxy path (UI host /api → backend)
        env:
          VERIFY_MAX_ATTEMPTS: '10'
          VERIFY_BASE_DELAY_MS: '10000'
        run: |
          # Same retry-with-backoff verify script as the direct check, but hit
          # the UI host so the request goes THROUGH the vite proxy (the only
          # path the web app has to the API). Single curls are too flaky on
          # this network (intermittent Cloudflare errors); the script's
          # exponential backoff is what makes the direct check reliable.
          node scripts/render-deploy-verify.js https://genz-whatsapp-1.onrender.com > /tmp/proxy-health.log 2>&1 || {
            echo '::error::PROXY PATH FAILED: genz-whatsapp-1.onrender.com/api/health did not return success via the proxy. Check GENZ_BACKEND_TARGET on the UI host (see RENDER_DEPLOY_GUIDE.md) — the Aug 2026 incident was exactly this.'
            tail -20 /tmp/proxy-health.log | sed 's/^/::error::/' | head -10
            exit 1
          }
          cat /tmp/proxy-health.log
          echo '::notice::proxy path OK — UI host /api reaches the backend'

      - name: Check update uptake (stuck-release alert)
        id: uptake
        env:
          REPO_VER: ${{ steps.apk.outputs.repo_ver }}
        run: |
          # Opt-in update analytics (Privacy → Update Analytics): devices that
          # SAW the banner for the current release but NONE acted on it within
          # the last 48h suggests users are stuck on the old version (or the
          # GitHub release asset failed). Warn and flag for a dedicated issue.
          REPO_VER_NOQ=$(echo "$REPO_VER" | tr -d '"')
          echo "-- update uptake for $REPO_VER_NOQ (last 48h) --"
          UPTAKE=$(curl -s -m 60 "https://genz-whatsapp.onrender.com/api/telemetry/events/uptake?version=$REPO_VER_NOQ&sinceHours=48" || echo '')
          echo "uptake: ${UPTAKE:-unreachable}"
          SHOWN=$(echo "$UPTAKE" | grep -o '"shown": [0-9]*' | grep -o '[0-9]*' | head -1 || echo 0)
          UPDATED=$(echo "$UPTAKE" | grep -o '"updated": [0-9]*' | grep -o '[0-9]*' | head -1 || echo 0)
          echo "shown=$SHOWN updated=$UPDATED"
          echo "uptake_shown=$SHOWN" >> "$GITHUB_OUTPUT"
          echo "uptake_updated=$UPDATED" >> "$GITHUB_OUTPUT"
          if [ "$UPTAKE" = "" ]; then
            echo '::warning::uptake endpoint unreachable (analytics disabled or API down) — skipping stuck-release check'
          elif [ "$SHOWN" -ge 3 ] && [ "$UPDATED" -eq 0 ]; then
            echo '::warning::update banner shown to multiple devices for the current release but nobody updated — likely stuck (filing issue)'
            echo "stuck=true" >> "$GITHUB_OUTPUT"
          else
            echo '::notice::uptake OK (or too few opt-in events to judge)'
          fi

      # Self-healing: when the whole check PASSES, close stale
      # "Production health check failed" issues (the UI-host /api/health
      # false positives from #10/#17, or any outage that recovered). Stuck-
      # release issues (📉) are NOT touched — they need human action.
      - name: Close stale alert issues when healthy
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['prod-health']
            });
            const stale = open.filter((i) => i.title.startsWith('⚠️ Production health check failed'));
            for (const issue of stale) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              console.log('Closed stale issue #' + issue.number);
            }
            if (stale.length === 0) console.log('No stale alert issues to close');

      # Email delivery is best-effort on top of the GitHub issues: needs the
      # ALERT_WEBHOOK_TOKEN secret (backend /api/telemetry/alerts + SMTP env
      # on Render). Without them the step is skipped and the issue stands.
      - name: Email stuck-release alert (best-effort)
        if: steps.uptake.outputs.stuck == 'true' && env.ALERT_TOKEN != '' && github.event_name != 'workflow_dispatch'
        env:
          ALERT_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
          REPO_VER: ${{ steps.apk.outputs.repo_ver }}
          UPTAKE_SHOWN: ${{ steps.uptake.outputs.uptake_shown }}
        run: |
          VER=$(echo "$REPO_VER" | tr -d '"')
          curl -s -m 20 -X POST https://genz-whatsapp.onrender.com/api/telemetry/alerts \
            -H "Content-Type: application/json" \
            -H "x-alert-token: $ALERT_TOKEN" \
            -d "{\"subject\":\"GENZ alert: users may be stuck on $VER\",\"section\":\"stuck-release\",\"message\":\"Release $VER was shown to $UPTAKE_SHOWN opt-in devices but none updated within 48h. See the GitHub issue for details.\"}" || echo '::warning::email alert send failed (SMTP/token not configured?)'

      - name: Check latest Render deploy status
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          LIVE_VER: ${{ steps.apk.outputs.live_ver }}
          REPO_VER: ${{ steps.apk.outputs.repo_ver }}
        run: node scripts/render-deploy-status.js --limit 3 || echo '::warning::could not read deploy history (credentials?)'

      - name: File stuck-release issue (nobody updated within 48h)
        if: steps.uptake.outputs.stuck == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const repoVer = process.env.REPO_VER || 'unknown';
            const shown = process.env.UPTAKE_SHOWN || '0';
            const updated = process.env.UPTAKE_UPDATED || '0';
            const title = `📉 Users may be stuck on an old version (${today})`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['prod-health']
            });
            const alreadyOpen = existing.some((issue) => issue.title === title);
            if (!alreadyOpen) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['prod-health'],
                body: [
                  '## Update release may be stuck',
                  '',
                  `- **Release:** ${repoVer} (repo version)`,
                  `- **Last 48h uptake (opt-in analytics):** ${shown} devices saw the update banner, **${updated}** updated.`,
                  '',
                  'Devices are seeing the banner but none are acting on it. Possible causes:',
                  '- The site APK download fails (`/genz-whatsapp.apk` unreachable or stale).',
                  '- Users tap Update but the install fails (signature/keystore mismatch, Play Protect).',
                  '- The banner is dismissed or not rendering on affected devices.',
                  '',
                  `- **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
                ].join('\n')
              });
              console.log('Stuck-release issue created');
            } else {
              console.log('Stuck-release issue already open — skipping duplicate');
            }
        env:
          REPO_VER: ${{ steps.apk.outputs.repo_ver }}
          UPTAKE_SHOWN: ${{ steps.uptake.outputs.uptake_shown }}
          UPTAKE_UPDATED: ${{ steps.uptake.outputs.uptake_updated }}

      - name: File alert issue on failure
        if: failure() && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `⚠️ Production health check failed (${today})`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['prod-health']
            });
            const alreadyOpen = existing.some((issue) => issue.title === title);
            if (!alreadyOpen) {
              const liveVer = process.env.LIVE_VER || 'unreachable';
              const repoVer = process.env.REPO_VER || 'unknown';
              const lag = liveVer !== repoVer;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['prod-health'],
                body: [
                  '## Production health check failed',
                  '',
                  `- **Time (UTC):** ${new Date().toISOString()}`,
                  `- **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  `- **Service:** https://genz-whatsapp-1.onrender.com`,
                  '',
                  lag
                    ? [
                        '## ⚠️ Deploy lag detected',
                        '',
                        '| | Version |',
                        '|---|---|',
                        `| **Repo** (latest code) | ${repoVer} |`,
                        `| **Live** (production) | ${liveVer} |`,
                        '',
                        `- Check the [deploy workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/deploy.yml) — the Render build may have failed.`,
                        `- Run the **Render status** workflow (Actions tab) for the deploy history, or check the dashboard.`,
                        `- APK channel: https://genz-whatsapp-1.onrender.com/genz-whatsapp.apk (site only, no GitHub)`
                      ].join('\n')
                    : 'Check the workflow run logs for the failing check (deploy state, `/api/health`, mongo connection, media storage, APK reachability).'
                ].join('\n')
              });
              console.log('Alert issue created');
            } else {
              console.log('Alert issue already open — skipping duplicate');
            }
