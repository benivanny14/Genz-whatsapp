name: Production Health Nightly

on:
  schedule:
    # Every night 03:15 UTC — verifies the deployed service on Render is
    # actually healthy (deploy live, mongo connected, cloudinary media).
    # Catches silent production outages the unit/e2e suites cannot.
    - cron: '15 3 * * *'
  workflow_dispatch:
    # Manual trigger from the Actions tab (verify production health on demand).

permissions:
  contents: read
  issues: write # to file an alert issue when a health check fails

jobs:
  prod-health:
    name: Production health check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify production health (Render API + /api/health)
        id: health
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          node scripts/render-deploy-verify.js > /tmp/prod-health.log 2>&1 || {
            echo '::error::Production health check FAILED'
            tail -20 /tmp/prod-health.log | sed 's/^/::error::/' | head -10
            exit 1
          }
          cat /tmp/prod-health.log

      - name: File alert issue on failure
        if: failure() && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `⚠️ Production health check failed (${today})`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['prod-health']
            });
            const alreadyOpen = existing.some((issue) => issue.title === title);
            if (!alreadyOpen) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['prod-health'],
                body: [
                  '## Production health check failed',
                  '',
                  `- **Time (UTC):** ${new Date().toISOString()}`,
                  `- **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  `- **Service:** https://genz-whatsapp-1.onrender.com`,
                  '',
                  'Check the workflow run logs for the failing check (deploy state, `/api/health`, mongo connection, media storage).'
                ].join('\n')
              });
              console.log('Alert issue created');
            } else {
              console.log('Alert issue already open — skipping duplicate');
            }
