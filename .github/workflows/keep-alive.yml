name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend to prevent sleep
        run: |
          echo "Pinging backend to keep Render free tier awake..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://genz-whatsapp.onrender.com/api/health || echo "000")
          echo "Backend status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Backend is awake"
          else
            echo "⚠️ Backend returned $STATUS (may be waking up)"
          fi
