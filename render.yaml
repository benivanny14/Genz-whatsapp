# Render Blueprint — GENZ WhatsApp
# Dashboard: New + → Blueprint → connect repo → path: render.yaml
# Secrets: set in Render Dashboard or via scripts/setup-render-env.js

services:
  - type: web
    name: genz-whatsapp
    runtime: node
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps && cd ../frontend && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        value: https://genz-whatsapp-1.onrender.com
      - key: PUBLIC_API_URL
        value: https://genz-whatsapp-1.onrender.com
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: MESSAGE_ENCRYPTION_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@genz-whatsapp.com
      - key: ALLOW_ANONYMOUS_DEVICE_AUTH
        value: "false"
      - key: ALLOW_MOCK_PAYMENTS
        value: "false"
      # ── Phone verification gate ────────────────────────────────
      # Keep OFF until an OTP delivery channel is configured
      # (WHATSAPP_OTP_ENABLED=true + WHATSAPP_CLOUD_API_* credentials).
      # With verification ON and no delivery channel, new registrations
      # never receive an OTP and are locked out of the app; the backend
      # refuses to start with that combination in production.
      - key: PHONE_VERIFICATION_REQUIRED
        value: "false"
      - key: WHATSAPP_OTP_ENABLED
        value: "false"
      - key: ADMIN_BASE_PATH
        value: /api/system-gateway-x9k
      - key: ADMIN_JWT_SECRET
        sync: false
