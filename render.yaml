# Render Blueprint — GENZ WhatsApp
# Dashboard: New + → Blueprint → connect repo → path: render.yaml
# Secrets: set in Render Dashboard → Environment (see RENDER_ENV_TEMPLATE.env + RENDER_RESTORE_CHECKLIST.md)

services:
  - type: web
    name: genz-whatsapp
    runtime: node
    rootDir: backend
    buildCommand: npm ci --legacy-peer-deps && cd ../frontend && npm ci --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        value: https://genz-whatsapp.onrender.com
      - key: PUBLIC_API_URL
        value: https://genz-whatsapp.onrender.com
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: MESSAGE_ENCRYPTION_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@genz-whatsapp.com
      - key: ALLOW_ANONYMOUS_DEVICE_AUTH
        value: "false"
      - key: ALLOW_MOCK_PAYMENTS
        value: "false"
      - key: ADMIN_BASE_PATH
        value: /api/system-gateway-x9k
      - key: ADMIN_JWT_SECRET
        sync: false
