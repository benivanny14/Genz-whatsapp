<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GENZ Messenger — Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #111b21; color: #e9edef; 
      display: flex; align-items: center; justify-content: center;
      height: 100vh; flex-direction: column;
      gap: 16px;
    }
    h1 { font-size: 1.5rem; }
    p { color: #8696a0; }
    a { color: #00a884; text-decoration: none; font-weight: 600; font-size: 1.2rem; }
    a:hover { text-decoration: underline; }
    .frame { width: 390px; height: 844px; border: 2px solid #2d3b44; border-radius: 34px; overflow: hidden; }
    .frame iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <div class="frame">
    <iframe src="http://127.0.0.1:5181/" title="GENZ Messenger"></iframe>
  </div>
</body>
</html>
